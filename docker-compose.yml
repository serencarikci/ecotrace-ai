services:
  postgres:
    image: postgres:16-alpine
    container_name: ecotrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecotrace}
      POSTGRES_USER: ${POSTGRES_USER:-ecotrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrace_dev_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ecotrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecotrace} -d ${POSTGRES_DB:-ecotrace}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecotrace-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ecotrace-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecotrace}:${POSTGRES_PASSWORD:-ecotrace_dev_password}@postgres:5432/${POSTGRES_DB:-ecotrace}
      ATTACHMENT_STORAGE_PATH: /data/attachments
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ecotrace_attachments:/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - ecotrace-net

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:8000
    container_name: ecotrace-web
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ecotrace-net

volumes:
  ecotrace_pgdata:
    name: ecotrace_pgdata
  ecotrace_attachments:
    name: ecotrace_attachments

networks:
  ecotrace-net:
    name: ecotrace-net
    driver: bridge
