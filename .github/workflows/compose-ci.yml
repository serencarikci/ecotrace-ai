name: Compose CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "docker-compose.yml"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".github/workflows/compose-ci.yml"
      - ".env.example"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "apps/api/Dockerfile"
      - "apps/web/Dockerfile"
      - "apps/web/nginx.conf"
      - ".github/workflows/compose-ci.yml"
      - ".env.example"

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Ensure attachment volume is declared
        run: |
          docker compose -f docker-compose.yml config | grep -q 'ecotrace_attachments'
          docker compose -f docker-compose.yml config | grep -q 'ATTACHMENT_STORAGE_PATH'
