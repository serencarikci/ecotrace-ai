name: Backend CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/api-image-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/api-image-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecotrace_test
          POSTGRES_USER: ecotrace
          POSTGRES_PASSWORD: ecotrace_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecotrace -d ecotrace_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      APP_DEBUG: "true"
      SECRET_KEY: test-secret-key-that-is-long-enough-32chars
      INITIAL_ADMIN_PASSWORD: EcoTraceAdmin!2024
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ecotrace_test
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ecotrace_dev_password
      DATABASE_URL: postgresql+psycopg://ecotrace:ecotrace_dev_password@localhost:5432/ecotrace_test
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      LOG_LEVEL: WARNING
      ATTACHMENT_STORAGE_PATH: /tmp/ecotrace-ci-attachments
      KNOWLEDGE_STORAGE_PATH: /tmp/ecotrace-ci-knowledge
      REPORT_STORAGE_PATH: /tmp/ecotrace-ci-reports
      BACKUP_STORAGE_PATH: /tmp/ecotrace-ci-backups
      MAX_ATTACHMENT_SIZE_MB: "5"
      MAX_CSV_IMPORT_ROWS: "5000"
      ALLOWED_ATTACHMENT_TYPES: pdf,csv,xlsx,png,jpeg,jpg
      AI_LLM_PROVIDER: local_grounded
      AI_EMBEDDING_PROVIDER: local_hash

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Prepare storage paths
        run: mkdir -p /tmp/ecotrace-ci-attachments /tmp/ecotrace-ci-knowledge /tmp/ecotrace-ci-reports /tmp/ecotrace-ci-backups

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: MyPy
        run: mypy src

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Verify migration head
        run: |
          alembic current | tee /tmp/alembic-current.txt
          alembic heads | tee /tmp/alembic-heads.txt
          # Require a single head and that `alembic current` is that head (no stale hardcoded rev).
          head_count="$(wc -l < /tmp/alembic-heads.txt | tr -d ' ')"
          test "$head_count" = "1"
          head_id="$(awk '{print $1; exit}' /tmp/alembic-heads.txt)"
          test -n "$head_id"
          grep -E "^${head_id}([[:space:]]|\\(|$)" /tmp/alembic-current.txt

      - name: Pytest with coverage
        run: pytest tests/ -v --cov=ecotrace --cov-report=term-missing --cov-fail-under=55

      - name: Seed idempotency smoke
        run: |
          # Pytest session teardown drops ORM tables but leaves alembic_version at head,
          # so a bare `alembic upgrade head` is a no-op. Rebuild schema, then seed twice.
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["DATABASE_URL"], isolation_level="AUTOCOMMIT")
          with engine.connect() as conn:
              conn.execute(text("DROP SCHEMA public CASCADE"))
              conn.execute(text("CREATE SCHEMA public"))
              conn.execute(text("GRANT ALL ON SCHEMA public TO CURRENT_USER"))
              conn.execute(text("GRANT ALL ON SCHEMA public TO public"))
          engine.dispose()
          PY
          alembic upgrade head
          python -m ecotrace.db.seed
          python -m ecotrace.db.seed

      - name: Assert production Dockerfile LO pins (fast)
        working-directory: ${{ github.workspace }}
        run: |
          test -f apps/api/Dockerfile
          test -f apps/api/official-see/template.xlsx
          grep -q 'LIBREOFFICE_VERSION=26.8.0' apps/api/Dockerfile
          grep -q 'LIBREOFFICE_SHA256_AARCH64=f989b73c31e7e16b3f99475bc5befaffdf42af75f83fe882293e1a0258cc9173' apps/api/Dockerfile
          grep -q 'LIBREOFFICE_SHA256_X86_64=d0a6031a3837e48f9854e6d2da6489b9fadbd814afa4741fa32a197741663a22' apps/api/Dockerfile
          grep -q 'LO_FILE_ARCH=x86-64' apps/api/Dockerfile
          grep -q 'useradd --create-home --uid 10001' apps/api/Dockerfile
          grep -q 'USER ecotrace' apps/api/Dockerfile
          grep -q 'alembic upgrade head' apps/api/docker-entrypoint.sh
          ! grep -q 'alembic stamp' apps/api/docker-entrypoint.sh
          echo '83170fde547c418dcae7f6a32852555d6874e092769f387b263108a231b2dd64  apps/api/official-see/template.xlsx' | sha256sum -c -

      - name: Dependency vulnerability scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit || true
        continue-on-error: true
