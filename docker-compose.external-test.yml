# Disposable external-test stack (do not use for public deploy).
# Usage from repo root:
#   docker compose -f docker-compose.external-test.yml build api
#   docker compose -f docker-compose.external-test.yml up -d postgres api

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ecotrace-ext-postgres
    environment:
      POSTGRES_DB: ecotrace_ext
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrace_ext_test_only}
    ports:
      - "${EXT_POSTGRES_HOST_PORT:-55433}:5432"
    volumes:
      - ecotrace_ext_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrace -d ecotrace_ext"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - ecotrace-ext-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: ecotrace-api:external-test
    container_name: ecotrace-ext-api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: "false"
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-true}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecotrace_ext
      POSTGRES_USER: ecotrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecotrace_ext_test_only}
      DATABASE_URL: postgresql+psycopg://ecotrace:${POSTGRES_PASSWORD:-ecotrace_ext_test_only}@postgres:5432/ecotrace_ext
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-localhost,127.0.0.1,api,ecotrace-ext-api}
      LIBREOFFICE_SOFFICE_PATH: /usr/bin/soffice
      OFFICIAL_SEE_TEMPLATE_PATH: /app/official-see/template.xlsx
      LIBREOFFICE_RECALC_TIMEOUT_SECONDS: "300"
      ATTACHMENT_STORAGE_PATH: /data/attachments
      KNOWLEDGE_STORAGE_PATH: /data/knowledge
      REPORT_STORAGE_PATH: /data/reports
      BACKUP_STORAGE_PATH: /data/backups
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "${EXT_API_HOST_PORT:-8011}:8000"
    volumes:
      - ecotrace_ext_reports:/data/reports
      - ecotrace_ext_attachments:/data/attachments
      - ecotrace_ext_knowledge:/data/knowledge
      - ecotrace_ext_backups:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - ecotrace-ext-net

volumes:
  ecotrace_ext_pgdata:
  ecotrace_ext_reports:
  ecotrace_ext_attachments:
  ecotrace_ext_knowledge:
  ecotrace_ext_backups:

networks:
  ecotrace-ext-net:
    driver: bridge
